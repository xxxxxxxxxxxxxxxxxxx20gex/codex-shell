[package]
name = "codex-shell"
version = "0.1.4"
description = "A personal desktop shell for Codex app-server"
authors = ["Codex Shell Contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codex_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Keep the distributable small and avoid retaining debug metadata in the
# installer. The package script also limits Cargo concurrency for low-memory
# Windows build hosts.
debug = 0
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
chrono = "0.4"
