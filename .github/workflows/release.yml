name: Build signed Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Runtime binaries are intentionally not tracked in Git. Before enabling
      # this workflow for a public release, provide CODEX_SHELL_RUNTIME and its
      # same-directory companion binaries from the approved runtime artifact.
      - name: Stage approved Codex Runtime
        shell: powershell
        env:
          CODEX_SHELL_RUNTIME: ${{ secrets.CODEX_SHELL_RUNTIME }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODEX_SHELL_RUNTIME)) {
            throw "CODEX_SHELL_RUNTIME is not configured for the release runner."
          }
          pnpm runtime:stage

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex Shell ${{ github.ref_name }}
          releaseBody: Signed Windows release generated by GitHub Actions.
          releaseDraft: true
          prerelease: false
