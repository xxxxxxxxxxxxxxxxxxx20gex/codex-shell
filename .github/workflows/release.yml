name: Build signed Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Runtime binaries are intentionally not tracked in Git. Repository
      # variables pin a public HTTPS ZIP and its SHA-256; the archive contains
      # codex.exe plus its three same-directory companion binaries.
      - name: Fetch and verify approved Codex Runtime
        shell: powershell
        env:
          CODEX_SHELL_RUNTIME_URL: ${{ vars.CODEX_SHELL_RUNTIME_URL }}
          CODEX_SHELL_RUNTIME_SHA256: ${{ vars.CODEX_SHELL_RUNTIME_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODEX_SHELL_RUNTIME_URL) -or [string]::IsNullOrWhiteSpace($env:CODEX_SHELL_RUNTIME_SHA256)) {
            throw "Set repository variables CODEX_SHELL_RUNTIME_URL and CODEX_SHELL_RUNTIME_SHA256 before publishing."
          }
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "codex-runtime"
          & .\scripts\fetch-runtime.ps1 -Url $env:CODEX_SHELL_RUNTIME_URL -Sha256 $env:CODEX_SHELL_RUNTIME_SHA256 -Destination $runtimeRoot
          if ($LASTEXITCODE -ne 0) { throw "Runtime download or verification failed." }
          $env:CODEX_SHELL_RUNTIME = Join-Path $runtimeRoot "codex.exe"
          "CODEX_SHELL_RUNTIME=$env:CODEX_SHELL_RUNTIME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          pnpm runtime:stage

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Codex Shell ${{ github.ref_name }}
          releaseBody: Signed Windows release generated by GitHub Actions.
          releaseDraft: false
          prerelease: false
